[project]
name = "hrm-management"
version = "0.1.0"
description = "Knovista employee and attendance management system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asgiref==3.12.1",
    "charset-normalizer==3.5.1",
    "Django==6.1.1",
    "et-xmlfile==2.0.0",
    "openpyxl==3.1.5",
    "pillow==12.3.0",
    "psycopg[binary]>=3.2,<4.0",
    "reportlab==5.0.1",
    "sqlparse==0.6.0",
    "tzdata==2026.3",
]

[tool.uv]
package = false

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"
