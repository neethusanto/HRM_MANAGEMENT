{% extends 'base.html' %}
{% load static %}

{% block title %}Admin Login - EMS{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card auth-admin fade-in">
        <div class="auth-card-head">
            <h4><i class="bi bi-shield-lock-fill"></i> Admin Login</h4>
        </div>
        <div class="auth-card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" name="username" id="username" class="form-control"
                           placeholder="Enter admin username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" id="password" class="form-control"
                           placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Sign in as Admin
                </button>
            </form>
            <div class="auth-footer">
                <a href="{% url 'Accounts:login_choice' %}">
                    <i class="bi bi-arrow-left"></i> Back to role selection
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
