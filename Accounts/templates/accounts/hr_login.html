{% extends 'base.html' %}
{% load static %}

{% block title %}HR Login - EMS{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card auth-hr fade-in">
        <div class="auth-card-head">
            <h4><i class="bi bi-person-vcard-fill"></i> HR Login</h4>
        </div>
        <div class="auth-card-body">
            <div class="alert alert-info">
                <i class="bi bi-info-circle-fill"></i>
                <div>HR accounts are created by the Administrator. Contact your admin for credentials.</div>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" name="username" id="username" class="form-control"
                           placeholder="Enter HR username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" id="password" class="form-control"
                           placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-success btn-lg w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Sign in as HR
                </button>
            </form>
            <div class="auth-footer">
                <a href="{% url 'Accounts:login_choice' %}">
                    <i class="bi bi-arrow-left"></i> Back to role selection
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
