{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Attendance{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill"></i> Confirm Deletion</h5>
            </div>
            <div class="card-body text-center py-4">
                <i class="bi bi-trash3 text-danger" style="font-size:48px;"></i>
                <p class="mt-3 mb-1">
                    Delete attendance for <strong>{{ attendance.employee.emp_name }}</strong>
                    on <strong>{{ attendance.date|date:"M d, Y" }}</strong>?
                </p>
                <p class="text-danger small">This action cannot be undone.</p>
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Yes, Delete
                        </button>
                        <a href="{% url 'Ems_app:attendance_list' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
